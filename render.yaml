services:
  - type: web
    name: areias-shop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false   # im Render-Dashboard eintragen (Secret), NICHT hier committen
      - key: ANTHROPIC_API_KEY
        sync: false   # im Render-Dashboard eintragen (Secret) – aktiviert den KI-Berater
      - key: STRIPE_WEBHOOK_SECRET
        sync: false   # aus Stripe → Webhooks (whsec_…) – aktiviert die Bestell-Mail
      - key: BREVO_API_KEY
        sync: false   # aus Brevo (SMTP/API) – verschickt die Bestell-Mail
      - key: ORDER_EMAIL
        value: iracemasiqueira83@gmail.com   # Empfänger der Bestell-Benachrichtigung
      - key: ADMIN_PASSWORD
        sync: false   # im Render-Dashboard setzen – schützt /admin (leer = /admin deaktiviert)
      - key: UPSTASH_REDIS_REST_URL
        sync: false   # Upstash Redis (REST) – dauerhafter Besucherzähler
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NODE_VERSION
        value: "20"
