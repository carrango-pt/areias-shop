<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 272" width="300" height="272" role="img" aria-label="Areia – Schmuck aus der Algarve">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Jost:wght@300;400&amp;display=swap');
      .mono{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;fill:url(#gold);stroke:none}
      .wm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;fill:url(#gold);stroke:none}
      .tg{font-family:'Jost','Helvetica Neue',sans-serif;font-weight:300;fill:#9C7A2E;stroke:none}
    </style>
    <linearGradient id="gold" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#F7E9AE"/>
      <stop offset="0.3" stop-color="#D9B457"/>
      <stop offset="0.5" stop-color="#B4832B"/>
      <stop offset="0.62" stop-color="#EED690"/>
      <stop offset="0.8" stop-color="#C39A3D"/>
      <stop offset="1" stop-color="#8A6A2F"/>
    </linearGradient>
    <linearGradient id="diaFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DCEDF9"/>
      <stop offset="1" stop-color="#A9CEE7"/>
    </linearGradient>
    <symbol id="dia" viewBox="-10 -11 20 22">
      <polygon points="0,-9.5 9,-3 6,9.5 -6,9.5 -9,-3" fill="url(#diaFill)" stroke="#8FBBDA" stroke-width="0.7"/>
      <polygon points="0,-5 4.6,-1.7 2.9,5 -2.9,5 -4.6,-1.7" fill="#F5FBFF"/>
      <g stroke="#B4DAF0" stroke-width="0.5">
        <line x1="0" y1="-9.5" x2="0" y2="-5"/><line x1="9" y1="-3" x2="4.6" y2="-1.7"/>
        <line x1="6" y1="9.5" x2="2.9" y2="5"/><line x1="-6" y1="9.5" x2="-2.9" y2="5"/>
        <line x1="-9" y1="-3" x2="-4.6" y2="-1.7"/>
      </g>
      <line x1="-2.4" y1="-2.4" x2="1.7" y2="0.7" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
    </symbol>
  </defs>
  <!-- Emblem -->
  <circle cx="150" cy="72" r="47" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <circle cx="150" cy="72" r="39.5" fill="none" stroke="url(#gold)" stroke-width="0.6"/>
  <use href="#dia" x="143" y="25" width="14" height="15.4"/>
  <text class="mono" x="150" y="94" text-anchor="middle" font-size="58">A</text>
  <!-- Wortmarke -->
  <text class="wm" x="150" y="186" text-anchor="middle" font-size="56" letter-spacing="17">AREIA</text>
  <!-- Trennlinie mit Diamant -->
  <line x1="112" y1="202" x2="139" y2="202" stroke="url(#gold)" stroke-width="0.8"/>
  <line x1="161" y1="202" x2="188" y2="202" stroke="url(#gold)" stroke-width="0.8"/>
  <use href="#dia" x="144.5" y="196" width="11" height="12.1"/>
  <!-- Tagline -->
  <text class="tg" x="150" y="222" text-anchor="middle" font-size="11" letter-spacing="6.5">SCHMUCK · ALGARVE</text>
</svg>
