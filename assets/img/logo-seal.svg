<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Areia · Algarve – Siegel">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Jost:wght@400;500&amp;display=swap');
      .mono{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;fill:url(#gold);stroke:none}
      .arc{font-family:'Jost','Helvetica Neue',sans-serif;font-weight:500;fill:#9C7A2E;stroke:none}
    </style>
    <linearGradient id="gold" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#F7E9AE"/>
      <stop offset="0.3" stop-color="#D9B457"/>
      <stop offset="0.5" stop-color="#B4832B"/>
      <stop offset="0.62" stop-color="#EED690"/>
      <stop offset="0.8" stop-color="#C39A3D"/>
      <stop offset="1" stop-color="#8A6A2F"/>
    </linearGradient>
    <linearGradient id="diaFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DCEDF9"/>
      <stop offset="1" stop-color="#A9CEE7"/>
    </linearGradient>
    <symbol id="dia" viewBox="-10 -11 20 22">
      <polygon points="0,-9.5 9,-3 6,9.5 -6,9.5 -9,-3" fill="url(#diaFill)" stroke="#8FBBDA" stroke-width="0.7"/>
      <polygon points="0,-5 4.6,-1.7 2.9,5 -2.9,5 -4.6,-1.7" fill="#F5FBFF"/>
      <g stroke="#B4DAF0" stroke-width="0.5">
        <line x1="0" y1="-9.5" x2="0" y2="-5"/>
        <line x1="9" y1="-3" x2="4.6" y2="-1.7"/>
        <line x1="6" y1="9.5" x2="2.9" y2="5"/>
        <line x1="-6" y1="9.5" x2="-2.9" y2="5"/>
        <line x1="-9" y1="-3" x2="-4.6" y2="-1.7"/>
      </g>
      <line x1="-2.4" y1="-2.4" x2="1.7" y2="0.7" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
    </symbol>
    <path id="seal-top" d="M23,110 A87,87 0 0 1 197,110"/>
    <path id="seal-bot" d="M197,110 A87,87 0 0 1 23,110"/>
  </defs>
  <!-- Ringe in Gold -->
  <circle cx="110" cy="110" r="104" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="110" cy="110" r="99" fill="none" stroke="url(#gold)" stroke-width="0.7"/>
  <circle cx="110" cy="110" r="70" fill="none" stroke="url(#gold)" stroke-width="1.4"/>
  <circle cx="110" cy="110" r="66.5" fill="none" stroke="url(#gold)" stroke-width="0.5"/>
  <!-- Umlaufender Schriftzug -->
  <text class="arc" font-size="13" letter-spacing="6"><textPath href="#seal-top" startOffset="50%" text-anchor="middle">AREIA</textPath></text>
  <text class="arc" font-size="9.5" letter-spacing="4"><textPath href="#seal-bot" startOffset="50%" text-anchor="middle">ALGARVE</textPath></text>
  <!-- Diamanten: Seiten (3 & 9 Uhr) + Solitär über dem Monogramm -->
  <use href="#dia" x="10.5" y="102" width="14" height="15.4"/>
  <use href="#dia" x="195.5" y="102" width="14" height="15.4"/>
  <use href="#dia" x="103" y="49" width="14" height="15.4"/>
  <!-- Monogramm -->
  <text class="mono" x="110" y="141" text-anchor="middle" font-size="80">A</text>
</svg>
