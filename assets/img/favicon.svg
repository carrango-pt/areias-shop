<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Areia">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;display=swap');
      .m{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;fill:url(#gold);stroke:none}
    </style>
    <linearGradient id="gold" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#F7E9AE"/>
      <stop offset="0.35" stop-color="#D9B457"/>
      <stop offset="0.55" stop-color="#EED690"/>
      <stop offset="0.8" stop-color="#C39A3D"/>
      <stop offset="1" stop-color="#9A751F"/>
    </linearGradient>
    <linearGradient id="diaFill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DCEDF9"/>
      <stop offset="1" stop-color="#A9CEE7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1E1B18"/>
  <circle cx="32" cy="33" r="25" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <circle cx="32" cy="33" r="21.5" fill="none" stroke="url(#gold)" stroke-width="0.6"/>
  <!-- Diamant-Solitär -->
  <polygon points="32,10.5 36,13.4 34.7,19 29.3,19 28,13.4" fill="url(#diaFill)" stroke="#8FBBDA" stroke-width="0.5"/>
  <text class="m" x="32" y="46" text-anchor="middle" font-size="34">A</text>
</svg>
