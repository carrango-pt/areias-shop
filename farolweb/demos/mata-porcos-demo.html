<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Mata Porcos · Portimão desde 1955</title>
<meta name="description" content="Restaurante Toino Zé – O Mata Porcos, Portimão. Cozinha algarvia tradicional desde 1955.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1d4e89; --azul-esc:#12345e; --azul-claro:#e8eff8;
  --creme:#fbf6ec; --papel:#fffdf8; --tinta:#1f2328; --suave:#5b6470;
  --terra:#b5502b; --ouro:#e0a526; --linha:#e4dccb;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;color:var(--tinta);background:var(--creme);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;color:var(--azul-esc)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* Demo-Banner */
.demo{background:var(--tinta);color:#fff;font-size:13px;text-align:center;padding:8px 16px}
.demo b{color:var(--ouro)}

/* Azulejo-Bordüre */
.azulejo{height:28px;background-color:var(--azul);
  background-image:
   radial-gradient(circle at 50% 50%, var(--papel) 0 4px, transparent 5px),
   radial-gradient(circle at 0 0, var(--papel) 0 7px, transparent 8px),
   radial-gradient(circle at 100% 0, var(--papel) 0 7px, transparent 8px),
   radial-gradient(circle at 0 100%, var(--papel) 0 7px, transparent 8px),
   radial-gradient(circle at 100% 100%, var(--papel) 0 7px, transparent 8px),
   linear-gradient(45deg, transparent 46%, rgba(255,255,255,.35) 47% 53%, transparent 54%),
   linear-gradient(-45deg, transparent 46%, rgba(255,255,255,.35) 47% 53%, transparent 54%);
  background-size:28px 28px}

/* Kopf */
header.top{background:var(--papel);border-bottom:1px solid var(--linha)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:20px;color:var(--azul-esc);text-decoration:none}
.logo small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--terra)}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--linha);background:#fff;border-radius:6px;padding:5px 9px;font:600 12px Inter,sans-serif;cursor:pointer;color:var(--suave)}
.langs button[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}

/* Hero */
.hero{background:var(--papel)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:56px}
.selo{display:inline-block;border:2px solid var(--terra);color:var(--terra);border-radius:999px;padding:4px 14px;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
.hero h1{font-size:clamp(38px,6vw,64px);margin-bottom:16px}
.hero h1 span{color:var(--terra)}
.hero p.lead{font-size:18px;color:var(--suave);max-width:34em;margin-bottom:26px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;border-radius:10px;padding:12px 20px;font-size:15px}
.btn.pri{background:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul-esc)}
.btn.sec{background:#fff;border:1px solid var(--linha);color:var(--azul-esc)}
.rating{margin-top:22px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--suave)}
.rating .stars{color:var(--ouro);font-size:18px;letter-spacing:2px}
.rating b{color:var(--tinta)}
.prato{width:100%;max-width:420px;justify-self:center}

/* Abschnitte */
section{padding:64px 0}
.kicker{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:8px}
section h2{font-size:clamp(28px,4vw,40px);margin-bottom:18px}
.historia .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.historia p{color:var(--suave);margin-bottom:14px;font-size:17px}
.factos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.facto{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:20px}
.facto strong{display:block;font-family:Fraunces,serif;font-size:30px;color:var(--azul)}
.facto span{font-size:14px;color:var(--suave)}

.menu{background:var(--azul-claro)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:10px}
.card{background:#fff;border-radius:14px;padding:22px;border-top:4px solid var(--azul)}
.card .ic{font-size:30px;margin-bottom:10px}
.card h3{font-size:20px;margin-bottom:6px}
.card p{font-size:14.5px;color:var(--suave)}
.nota{margin-top:18px;font-size:14px;color:var(--suave)}

.visita .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:36px}
.horas{background:var(--papel);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
.horas div{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--linha);font-size:15px}
.horas div:last-child{border-bottom:0}
.horas .hoje{background:var(--azul);color:#fff;font-weight:600}
.horas .fech{color:var(--terra)}
.horas .hoje.fech{color:#fff}
.morada{margin-top:18px;font-size:15px}
.morada p{margin-bottom:6px}
.mapa{border-radius:14px;overflow:hidden;border:1px solid var(--linha);min-height:340px;background:#ddd}
.mapa iframe{width:100%;height:100%;min-height:340px;border:0;display:block}

footer{background:var(--azul-esc);color:#cfd9e8;padding:36px 0 110px;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
footer a{color:#fff}

/* Mobile-Leiste */
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);display:none;grid-template-columns:repeat(3,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.barra a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;text-decoration:none;font-size:12px;font-weight:600;color:var(--azul-esc)}
.barra a:first-child{background:var(--azul);color:#fff}
.barra svg{width:22px;height:22px}

@media (max-width:820px){
  .hero .wrap,.historia .wrap,.visita .wrap{grid-template-columns:1fr;gap:28px}
  .hero .wrap{padding-top:32px;padding-bottom:40px}
  .prato{max-width:300px;order:-1}
  .cards{grid-template-columns:1fr 1fr}
  section{padding:48px 0}
  .barra{display:grid}
  footer{padding-bottom:110px}
}
@media (max-width:480px){
  .wrap{padding:0 16px}
  .cards{grid-template-columns:1fr}
  .hero .btns .btn{flex:1;justify-content:center}
  .logo{font-size:18px}
}
@media (min-width:821px){footer{padding-bottom:36px}}
</style>
</head>

const T={

};
// 0=So … 6=Sa: Sa nur mittags, So geschlossen
const PLAN={0:"closed",1:"open",2:"open",3:"open",4:"open",5:"open",6:"lunch"};
function setLang(l){
  const t=T[l]||T.pt; document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.innerHTML=t[e.dataset.i18n]});
  document.querySelectorAll("[data-i18n-html]").forEach(e=>{e.innerHTML=t[e.dataset.i18nHtml]});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  const hoje=new Date().getDay(), box=document.getElementById("horas"); box.innerHTML="";
  [1,2,3,4,5,6,0].forEach(d=>{
    const row=document.createElement("div");
    if(d===hoje)row.classList.add("hoje"); if(PLAN[d]==="closed")row.classList.add("fech");
    row.innerHTML=`<span>${t.days[d]}${d===hoje?" · "+t.today:""}</span><span>${t[PLAN[d]]}</span>`;
    box.appendChild(row);
  });
  try{localStorage.setItem("mp-lang",l)}catch(e){}
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
let start="pt";
try{start=localStorage.getItem("mp-lang")||""}catch(e){}
if(!T[start]){const n=(navigator.language||"pt").slice(0,2);start=T[n]?n:"pt"}
setLang(start);
